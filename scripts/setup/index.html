<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>协作岛 · 安装引导</title>
    <link rel="stylesheet" href="/wizard.css" />
    <script src="/wizard.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside>
        <a class="brand" href="/">🏝️ <strong>协作岛</strong></a>
        <p>安装与配置</p>
        <nav aria-label="安装步骤">
          <ol id="steps">
            <li>环境检测</li>
            <li>数据库与存储</li>
            <li>网站与管理员</li>
            <li>安装确认</li>
            <li>执行与完成</li>
          </ol>
        </nav>
        <div class="aside-note">
          所有配置统一用于聊天、管理后台和实时服务。<br />已有数据升级时保留。
        </div>
      </aside>
      <main>
        <header>
          <span id="step-label">准备安装</span
          ><span class="pill">本机安装引导</span>
        </header>
        <div id="notice" role="alert" hidden></div>
        <section id="screen" aria-live="polite">
          <h1>正在检测环境</h1>
          <p>检查运行环境、存储及可用数据库…</p>
        </section>
        <footer>
          <span>配置凭据仅保存在本机受保护的文件中。</span>
          <div>
            <button id="back" class="secondary" hidden>上一步</button
            ><button id="next" disabled>正在检测</button>
          </div>
        </footer>
      </main>
    </div>
  </body>
</html>
