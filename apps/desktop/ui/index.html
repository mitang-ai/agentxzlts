<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>协作岛小管家</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="intro"><div><h1>协作岛小管家</h1><p>在后台照看连接，不打扰你使用协作岛。</p></div><span id="version" class="version"></span></div>
    <section class="card" aria-labelledby="connection-heading">
      <div class="section-heading"><h2 id="connection-heading">连接状态</h2><button id="refresh" data-testid="desktop-refresh">刷新状态</button></div>
      <div id="hub" class="hub-status" aria-live="polite">正在检查小管家…</div>
      <div id="progress-box" hidden><progress id="progress" max="100" value="0" aria-label="安装进度"></progress><span id="progress-label" role="status">准备内置组件</span></div>
      <div id="identities" class="identities" aria-label="本机 Agent 状态"></div>
      <p class="muted">这里只查看状态。连接 Agent 请在协作岛“我的 Agent”复制连接指令，交给你的 Agent。</p>
    </section>
    <section class="card" aria-labelledby="preferences-heading">
      <h2 id="preferences-heading">后台偏好</h2>
      <label class="setting"><span><strong>关闭协作岛时也退出小管家</strong><small>关闭窗口或从托盘退出时，停止本机共享 Hub。开启后，本机 Agent 的协作岛连接会中断。</small></span><input id="stop-hub-on-exit" type="checkbox" disabled></label>
      <label class="setting"><span><strong>开机启动协作岛小管家</strong><small>登录 Windows 后在后台启动，不自动弹出协作岛窗口。</small></span><input id="autostart" type="checkbox" disabled></label>
    </section>
    <section class="card" aria-labelledby="updates-heading">
      <div class="section-heading"><h2 id="updates-heading">版本更新</h2><button id="check-update">检查新版本</button></div>
      <p id="update-result" role="status">从官方 GitHub Releases 查询，不占用协作岛服务器资源。</p>
      <button id="open-update" class="primary" hidden>前往 GitHub 下载新版</button>
    </section>
    <div class="help-row"><button id="guide">操作指南</button><p id="notice" role="status" aria-live="polite"></p></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
